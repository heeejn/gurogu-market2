<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>구로구마켓</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="구로구마켓">
  <link rel="apple-touch-icon" href="gurogu-market-logo.png">
  <!-- Web Push -->
  <style>
    /* ─── 리셋 & 기본 ─── */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --sat: env(safe-area-inset-top, 0px); /* safe-area-inset-top JS에서 읽기 위해 */
      --pink: #D4537E; --pink-dark: #993556;
      --pink-bg: #FBEAF0; --pink-br: #ED93B1;
      --pur-bg: #EEEDFE; --pur: #534AB7; --pur-br: #AFA9EC; --pur-dark: #26215C;
      --teal-bg: #E1F5EE; --teal: #1D9E75; --teal-dark: #085041; --teal-br: #9FE1CB;
      --bg: #F7F8FA; --surface: #fff;
      --text: #1A1A2E; --text2: #4A5068; --text3: #9BA3B8;
      --br: #E8EAF0; --br2: #D0D5E8;
      --r: 14px;
    }
    /* html을 1px 스크롤 가능하게 → status bar tap 시 scrollY 0으로 → scroll 이벤트로 감지 */
    html { height: calc(100% + 1px); overflow-y: scroll; overscroll-behavior-y: none; scrollbar-width: none; }
    html::-webkit-scrollbar { display: none; }
    body { height: 100%; overflow: hidden; }
    body { font-family: 'Nanum Gothic', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }

    /* ─── 앱 래퍼 ─── */
    #app { width: 100%; max-width: 430px; height: 100dvh; margin: 0 auto; position: relative; overflow: hidden; background: var(--bg); }

    /* ─── 화면 전환 ─── */
    .screen { position: absolute; inset: 0; background: var(--bg); overflow-y: hidden; -webkit-overflow-scrolling: touch; transition: transform .3s cubic-bezier(.32,.72,0,1); will-change: transform; z-index: 1; }
    .screen.right { transform: translateX(100%); }
    .screen.left  { transform: translateX(-100%); pointer-events: none; }
    /* 활성 화면만 스크롤 가능 → iOS UIScrollView가 하나만 존재 */
    .screen.active { transform: translateX(0); z-index: 10; overflow-y: auto; overscroll-behavior-y: contain; }
    .ptr { position: absolute; top: env(safe-area-inset-top,0px); left: 50%; transform: translate(-50%, -120%); z-index: 50; background: var(--surface); color: var(--pink-dark); border: .5px solid var(--pink-br); box-shadow: 0 6px 18px rgba(30,30,50,.08); border-radius: 999px; padding: 8px 13px; font-size: 12px; font-weight: 800; display: flex; align-items: center; gap: 6px; transition: transform .18s ease; pointer-events: none; }
    .ptr.show { transform: translate(-50%, 12px); }
    .ptr .spin { width: 14px; height: 14px; }

    /* ─── 헤더 ─── */
    .hdr { height: calc(56px + env(safe-area-inset-top,0px)); box-sizing: border-box; background: var(--surface); border-bottom: .5px solid var(--br); display: flex; align-items: center; justify-content: space-between; padding: env(safe-area-inset-top,0px) 14px 0; position: sticky; top: 0; z-index: 20; }
    .logo { display: flex; align-items: center; gap: 9px; }
    .logo-mark { width: 38px; height: 38px; border-radius: 50%; overflow: hidden; flex-shrink: 0; background: #fff; display: flex; align-items: center; justify-content: center; }
    .logo-img { width: 100%; height: 100%; object-fit: cover; transform: scale(1.38); display: block; }
    .logo-name { font-size: 20px; font-weight: 800; color: var(--text); letter-spacing: -.3px; }
    .hdr-r { display: flex; gap: 6px; align-items: center; }
    .hbtn { display: flex; align-items: center; gap: 3px; border: .5px solid var(--br2); border-radius: 999px; padding: 6px 12px; font-size: 12px; font-weight: 700; cursor: pointer; background: var(--surface); color: var(--text2); font-family: inherit; -webkit-tap-highlight-color: transparent; transition: background .1s; position: relative; }
    .hbtn:active { background: var(--bg); }
    .hbtn-pink { background: var(--pink-bg); color: var(--pink-dark); border-color: var(--pink-br); }
    .pill { display: flex; align-items: center; gap: 5px; background: var(--pur-bg); color: var(--pur-dark); border: .5px solid var(--pur-br); border-radius: 999px; padding: 4px 11px 4px 4px; font-size: 11px; font-weight: 800; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .pill-av { width: 22px; height: 22px; border-radius: 50%; overflow: hidden; background: var(--pur); display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 800; color: #fff; flex-shrink: 0; }
    .pill-av img { width: 100%; height: 100%; object-fit: cover; }

    /* ─── 서브 헤더 ─── */
    .sub-hdr { height: calc(56px + env(safe-area-inset-top,0px)); box-sizing: border-box; background: var(--surface); border-bottom: .5px solid var(--br); display: flex; align-items: center; gap: 10px; padding: env(safe-area-inset-top,0px) 14px 0; position: sticky; top: 0; z-index: 20; }
    .back-btn { width: 32px; height: 32px; background: var(--bg); border: .5px solid var(--br); border-radius: 999px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; -webkit-tap-highlight-color: transparent; }
    .sub-title { font-size: 15px; font-weight: 800; flex: 1; }
    .sub-right { display: flex; gap: 6px; }

    /* ─── 히어로 ─── */
    .hero { background: var(--surface); padding: 13px 14px 12px; border-bottom: .5px solid var(--br); }
    .hero p { font-size: 14px; color: var(--text2); line-height: 1.5; margin-bottom: 3px; font-weight: 400; }
    .hero p:last-of-type { margin-bottom: 9px; }
    .search-row { display: flex; gap: 7px; }
    .search-row input { flex: 1; height: 38px; border: .5px solid var(--br2); border-radius: 10px; padding: 0 12px; font-size: 13px; background: var(--bg); color: var(--text); font-family: inherit; }
    .search-row input:focus { outline: none; border-color: var(--pink); }
    .search-row button { height: 38px; padding: 0 14px; background: var(--pink); color: #fff; border: none; border-radius: 10px; font-size: 13px; font-weight: 800; cursor: pointer; font-family: inherit; }

    /* ─── 필터 / 탭 ─── */
    .filter-bar { display: flex; gap: 8px; padding: 10px 14px; background: var(--surface); border-bottom: .5px solid var(--br); overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .filter-bar::-webkit-scrollbar { display: none; }
    .chip { min-height: 36px; min-width: max-content; padding: 0 12px; border-radius: 999px; border: .5px solid var(--br); font-size: 12px; font-weight: 800; cursor: pointer; white-space: nowrap; color: var(--text2); background: var(--surface); font-family: inherit; -webkit-tap-highlight-color: transparent; display: flex; align-items: center; justify-content: center; text-align: center; line-height: 1; flex: 0 0 auto; }
    .chip.on { background: var(--pink-bg); color: var(--pink-dark); border-color: var(--pink-br); }
    .stat-tabs { display: flex; background: var(--surface); border-bottom: .5px solid var(--br); position: sticky; top: calc(56px + env(safe-area-inset-top,0px)); z-index: 15; }
    .stab { flex: 1; text-align: center; padding: 9px 0; font-size: 13px; font-weight: 700; color: var(--text3); cursor: pointer; border-bottom: 2px solid transparent; -webkit-tap-highlight-color: transparent; }
    .stab.on { color: var(--pink-dark); border-bottom-color: var(--pink); }

    /* ─── 그리드 ─── */
    .content { padding: 12px 14px 24px; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .card { background: var(--surface); border-radius: var(--r); border: .5px solid var(--br); overflow: hidden; cursor: pointer; position: relative; -webkit-tap-highlight-color: transparent; }
    .card:active { opacity: .88; }
    .card-thumb { width: 100%; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 32px; overflow: hidden; background: var(--surface); }
    .card-thumb img { width: 100%; height: 100%; object-fit: contain; display: block; background: var(--surface); }
    .card-thumb.ct-shimmer { background: linear-gradient(110deg, #F3F5F8 8%, #FAFBFC 18%, #EEF1F5 33%); background-size: 200% 100%; animation: photoShimmer 1.2s linear infinite; }
    .card-thumb.ct-loaded { background: var(--surface); animation: none; }
    .photo-img { opacity: 0; transition: opacity .12s ease; }
    .photo-img.loaded { opacity: 1; }
    .photo-loading { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: transparent; background: linear-gradient(110deg, #F3F5F8 8%, #FAFBFC 18%, #EEF1F5 33%); background-size: 200% 100%; animation: photoShimmer 1.2s linear infinite; font-size: 0; }
    @keyframes photoShimmer { to { background-position-x: -200%; } }
    .card-body { padding: 8px 9px 10px; border-top: .5px solid var(--br); }
    .card-name { font-size: 12px; font-weight: 700; color: var(--text); margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-price { font-size: 13px; font-weight: 800; color: var(--pink-dark); }
    .card-sub { font-size: 10px; color: var(--text3); margin-top: 5px; display: flex; align-items: center; justify-content: space-between; }
    .card-sub-l { display: flex; align-items: center; gap: 3px; }
    .card-sub-r { display: flex; align-items: center; gap: 6px; }
    .card-stat { display: flex; align-items: center; gap: 2px; }
    .mini-av { width: 13px; height: 13px; border-radius: 50%; overflow: hidden; flex-shrink: 0; background: var(--pur-bg); display: flex; align-items: center; justify-content: center; font-size: 6px; font-weight: 800; color: var(--pur); }
    .mini-av img { width: 100%; height: 100%; object-fit: cover; }
    .heart-btn { position: absolute; top: 6px; right: 6px; background: var(--surface); border: .5px solid var(--br); border-radius: 999px; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 13px; -webkit-tap-highlight-color: transparent; }
    .sold-badge { background: rgba(16,16,32,.92); color: #fff; font-size: 11px; font-weight: 800; padding: 5px 9px; border-radius: 999px; box-shadow: 0 4px 12px rgba(0,0,0,.24); border: 1px solid rgba(255,255,255,.65); }
    .mine-badge { background: #D4537E; color: #fff; font-size: 11px; font-weight: 800; padding: 5px 9px; border-radius: 999px; box-shadow: 0 4px 12px rgba(153,53,86,.28); border: 1px solid rgba(255,255,255,.75); }
    .card-badges { position: absolute; top: 7px; left: 7px; z-index: 3; display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
    .empty { text-align: center; padding: 40px 0; color: var(--text3); font-size: 13px; font-weight: 700; line-height: 2.4; grid-column: span 2; }
    .empty-state { grid-column: span 2; text-align: center; padding: 48px 20px 20px; color: var(--text3); font-size: 13px; font-weight: 700; line-height: 2.2; }
    .footer-credit { text-align: center; padding: 18px 0 calc(env(safe-area-inset-bottom, 0px) + 20px); font-size: 11px; color: var(--text3); font-weight: 700; letter-spacing: 0.3px; }

    /* ─── 상품 상세 ─── */
    .det-gallery { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; background: var(--surface); }
    .det-gallery::-webkit-scrollbar { display: none; }
    .det-img { width: 100%; flex: 0 0 100%; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 72px; overflow: hidden; scroll-snap-align: start; cursor: zoom-in; }
    .det-img img { width: 100%; height: 100%; object-fit: contain; display: block; background: var(--surface); }
    .det-content { background: var(--surface); padding: 14px; }
    .det-price { font-size: 22px; font-weight: 800; color: var(--pink-dark); margin-bottom: 3px; }
    .det-title { font-size: 15px; font-weight: 800; margin-bottom: 5px; }
    .det-stats { display: flex; gap: 12px; margin-bottom: 8px; }
    .det-stat { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--text3); font-weight: 700; }
    .det-desc { font-size: 13px; color: var(--text2); line-height: 1.7; margin-bottom: 12px; white-space: pre-wrap; word-break: break-word; }
    .det-seller { display: flex; align-items: center; gap: 8px; margin-bottom: 13px; padding: 10px 12px; background: var(--bg); border-radius: 10px; border: .5px solid var(--br); }
    .det-sav { width: 28px; height: 28px; border-radius: 50%; overflow: hidden; background: var(--pur-bg); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; color: var(--pur-dark); flex-shrink: 0; }
    .det-sav img { width: 100%; height: 100%; object-fit: cover; }
    .det-sname { font-size: 12px; font-weight: 800; }
    .det-time { font-size: 11px; color: var(--text3); margin-left: auto; }
    .wish-btn { background: var(--surface); border: .5px solid var(--br2); border-radius: 10px; width: 46px; height: 46px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 17px; flex-shrink: 0; -webkit-tap-highlight-color: transparent; }
    .wish-btn.on { border-color: var(--pink-br); }
    .own-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-bottom: 13px; }
    .own-actions button { min-width: 0; margin-bottom: 0; white-space: normal; line-height: 1.3; text-align: center; width: 100%; border-radius: 10px; padding: 11px 6px; font-size: 12px; font-weight: 800; cursor: pointer; font-family: inherit; }
    .sold-tog { background: var(--bg); border: .5px solid var(--br2); color: var(--text2); }
    .sold-tog.on { background: rgba(16,16,32,.88); color: #fff; border-color: rgba(16,16,32,.88); }
    .edit-item-btn { background: var(--teal-bg); border: .5px solid var(--teal-br); color: var(--teal-dark); }
    .del-item-btn { background: #FFF5F6; border: .5px solid #F2B8C2; color: #B4233B; }
    .del-item-btn:disabled { opacity: .6; cursor: default; }

    /* ─── 댓글 ─── */
    .cmt-wrap { border-top: .5px solid var(--br); padding-top: 13px; }
    .cmt-head { font-size: 13px; font-weight: 800; margin-bottom: 10px; }
    .cmt-form { display: flex; gap: 6px; margin-bottom: 11px; align-items: flex-start; }
    .cmt-inp { flex: 1; min-height: 38px; max-height: 120px; border: .5px solid var(--br2); border-radius: 10px; padding: 8px 12px; font-size: 13px; font-family: inherit; color: var(--text); background: var(--bg); resize: none; overflow-y: auto; line-height: 1.4; }
    .cmt-inp:focus { outline: none; border-color: var(--pink); }
    .cmt-post { background: var(--pink-bg); color: var(--pink-dark); border: .5px solid var(--pink-br); border-radius: 10px; padding: 0 13px; height: 38px; font-size: 12px; font-weight: 700; cursor: pointer; font-family: inherit; white-space: nowrap; }
    .cmt-list { display: flex; flex-direction: column; gap: 7px; }
    .cmt-item { background: var(--bg); border-radius: 10px; padding: 9px 11px; border: .5px solid var(--br); }
    .cmt-top { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
    .cmt-av { width: 22px; height: 22px; border-radius: 50%; overflow: hidden; flex-shrink: 0; background: var(--pur-bg); display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 800; color: var(--pur); }
    .cmt-av img { width: 100%; height: 100%; object-fit: cover; }
    .cmt-nick { font-size: 12px; font-weight: 800; color: var(--pink-dark); }
    .seller-tag { font-size: 9px; font-weight: 800; color: var(--pink-dark); background: var(--pink-bg); border: .5px solid var(--pink-br); border-radius: 999px; padding: 2px 6px; }
    .cmt-time { font-size: 10px; color: var(--text3); margin-left: auto; }
    .cmt-text { font-size: 13px; line-height: 1.5; margin-bottom: 6px; }
    .cmt-acts { display: flex; gap: 8px; }
    .ca { background: none; border: none; font-size: 11px; color: var(--text3); cursor: pointer; padding: 0; font-family: inherit; font-weight: 700; }
    .ca:active { color: var(--pink-dark); }
    .rep-form { display: flex; gap: 5px; margin-top: 8px; align-items: flex-start; }
    .rep-inp { flex: 1; min-height: 32px; max-height: 96px; border: .5px solid var(--br2); border-radius: 8px; padding: 6px 10px; font-size: 12px; font-family: inherit; color: var(--text); background: var(--surface); resize: none; overflow-y: auto; line-height: 1.4; }
    .rep-inp:focus { outline: none; border-color: var(--teal); }
    .rep-post { background: var(--teal-bg); color: var(--teal-dark); border: .5px solid var(--teal-br); border-radius: 8px; padding: 0 11px; height: 32px; font-size: 12px; font-weight: 700; cursor: pointer; font-family: inherit; }
    .replies { margin-top: 8px; display: flex; flex-direction: column; gap: 5px; }
    .rep-item { background: var(--surface); border-radius: 8px; padding: 7px 10px; border: .5px solid var(--br); margin-left: 12px; }
    .rep-nick { font-size: 11px; font-weight: 800; color: var(--teal-dark); }
    .rep-text { font-size: 12px; margin-top: 2px; line-height: 1.6; }
    .rep-acts { display: flex; gap: 6px; margin-top: 4px; }
    .ei { width: 100%; height: 28px; border: .5px solid var(--br2); border-radius: 6px; padding: 0 9px; font-size: 12px; font-family: inherit; color: var(--text); margin-bottom: 4px; background: var(--surface); }

    /* ─── 마이페이지 ─── */
    .prof-card { margin: 12px 14px; background: var(--pur-bg); border: .5px solid var(--pur-br); border-radius: var(--r); padding: 14px; display: flex; align-items: center; gap: 12px; }
    .prof-av-wrap { position: relative; flex-shrink: 0; cursor: pointer; }
    .prof-av { width: 52px; height: 52px; border-radius: 50%; background: var(--pur); overflow: hidden; border: 2px solid #fff; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 800; color: #fff; }
    .prof-av img { width: 100%; height: 100%; object-fit: cover; }
    .prof-cam { position: absolute; bottom: 0; right: 0; width: 18px; height: 18px; background: var(--pink); border-radius: 50%; border: 1.5px solid #fff; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #fff; }
    .prof-info h3 { font-size: 14px; font-weight: 800; color: var(--pur-dark); }
    .prof-info p { font-size: 11px; color: var(--pur); margin-top: 1px; }
    .edit-nick-btn { margin-left: auto; background: var(--surface); border: .5px solid var(--pur-br); border-radius: 999px; padding: 5px 10px; font-size: 11px; font-weight: 700; cursor: pointer; color: var(--pur-dark); font-family: inherit; }
    .edit-form { display: none; margin: 0 14px 10px; background: var(--surface); border: .5px solid var(--br); border-radius: 12px; padding: 11px 12px; }
    .edit-form.open { display: block; }
    .edit-label { font-size: 11px; font-weight: 800; color: var(--text2); margin-bottom: 5px; }
    .edit-row { display: flex; gap: 6px; }
    .edit-row input { flex: 1; height: 34px; border: .5px solid var(--br2); border-radius: 8px; padding: 0 10px; font-size: 13px; font-family: inherit; color: var(--text); background: var(--bg); }
    .edit-row input:focus { outline: none; border-color: var(--pink); }
    .save-btn { background: var(--pink); color: #fff; border: none; border-radius: 8px; height: 34px; padding: 0 13px; font-size: 13px; font-weight: 800; cursor: pointer; }
    .stats { display: flex; gap: 7px; padding: 0 14px 12px; }
    .stat { flex: 1; background: var(--surface); border: .5px solid var(--br); border-radius: 12px; padding: 10px; text-align: center; }
    .stat-n { font-size: 18px; font-weight: 800; color: var(--pink-dark); }
    .stat-l { font-size: 10px; color: var(--text3); font-weight: 700; margin-top: 2px; }
    .my-tabs { display: flex; background: var(--surface); border-bottom: .5px solid var(--br); }
    .my-tab { flex: 1; text-align: center; padding: 10px 0; font-size: 12px; font-weight: 700; color: var(--text3); cursor: pointer; border-bottom: 2px solid transparent; -webkit-tap-highlight-color: transparent; }
    .my-tab.on { color: var(--pink-dark); border-bottom-color: var(--pink); }
    .my-body { padding: 10px 0 24px; }
    .item-row { display: flex; align-items: center; gap: 10px; background: var(--surface); border-bottom: .5px solid var(--br); padding: 11px 14px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .item-row:active { background: var(--bg); }
    .item-row-em { font-size: 20px; width: 40px; height: 40px; background: var(--bg); border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; overflow: hidden; }
    .item-row-em img { width: 100%; height: 100%; object-fit: contain; display: block; background: var(--surface); }
    .item-row-info { flex: 1; min-width: 0; }
    .item-row-name { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-row-price { font-size: 12px; font-weight: 800; color: var(--pink-dark); margin-top: 1px; }
    .item-row-meta { font-size: 11px; color: var(--text3); margin-top: 2px; }
    .status-pill { font-size: 10px; padding: 3px 9px; border-radius: 999px; font-weight: 700; flex-shrink: 0; }
    .sp-on { background: var(--teal-bg); color: var(--teal-dark); }
    .sp-off { background: var(--bg); color: var(--text3); border: .5px solid var(--br); }
    .empty-my { text-align: center; padding: 40px 14px; color: var(--text3); font-size: 13px; font-weight: 700; line-height: 2.4; }

    /* ─── 알림 ─── */

    count.textContent = photoModalPhotos.length > 1 ? `${photoModalIndex + 1} / ${photoModalPhotos.length}` : '';
  }
  modal.querySelector('.photo-nav.prev')?.classList.toggle('hide', photoModalPhotos.length < 2);
  modal.querySelector('.photo-nav.next')?.classList.toggle('hide', photoModalPhotos.length < 2);
}
function movePhoto(delta) {
  if (photoModalPhotos.length < 2 || photoZoomLevel > 1) return;
  photoModalIndex = (photoModalIndex + delta + photoModalPhotos.length) % photoModalPhotos.length;
  setPhotoZoom(1, 0, 0);
  updatePhotoModalImage();
}
function setPhotoZoom(z, px, py) {
  const modal = document.getElementById('_photoModal');
  const img = modal?.querySelector('.photo-modal-img');
  if (!modal || !img) return;
  if (!photoBaseW) photoBaseW = img.offsetWidth || Math.min(window.innerWidth * 0.92, 430);
  if (!photoBaseH) photoBaseH = img.offsetHeight || window.innerHeight * 0.88;
  photoZoomLevel = Math.max(1, Math.min(5, z));
  if (photoZoomLevel <= 1) {
    photoZoomLevel = 1; photoPanX = 0; photoPanY = 0;
  } else {
    const maxPanX = Math.max(0, (photoBaseW * photoZoomLevel - window.innerWidth) / 2);
    const maxPanY = Math.max(0, (photoBaseH * photoZoomLevel - window.innerHeight) / 2);
    photoPanX = Math.max(-maxPanX, Math.min(maxPanX, px ?? 0));
    photoPanY = Math.max(-maxPanY, Math.min(maxPanY, py ?? 0));
  }
  img.style.transform = `translate(${photoPanX}px,${photoPanY}px) scale(${photoZoomLevel})`;
  modal.classList.toggle('zoomed', photoZoomLevel > 1);
}
function closePhotoModal() {
  document.getElementById('_photoModal')?.remove();
  photoZoomLevel = 1;
  photoPanX = 0; photoPanY = 0;
  photoBaseW = 0; photoBaseH = 0;
  photoLastTap = 0;
  photoPinchStartDist = 0; photoPinchStartZoom = 1;
  photoPinching = false; photoIsDragging = false;
  photoModalPhotos = []; photoModalIndex = 0;
}

/* ── 화면 전환 ── */
const allScreens = ['s-nick', 's-main', 's-det', 's-my', 's-sell', 's-noti'];
function goTo(id) {
  const cur = screenHistory[screenHistory.length - 1];
  if (cur === id) return;
  document.getElementById(cur).className = 'screen left';
  document.getElementById(id).className = 'screen active';
  allScreens.filter(s => s !== cur && s !== id).forEach(s => {
    document.getElementById(s).className = 'screen right';
  });
  screenHistory.push(id);
}
function goBack() {
  if (screenHistory.length <= 1) return;
  const cur = screenHistory.pop();
  const prev = screenHistory[screenHistory.length - 1];
  document.getElementById(cur).className = 'screen right';
  document.getElementById(prev).className = 'screen active';
  if (prev === 's-main') {
    renderMainList();
    hydrateMainMeta(document.getElementById('_sq')?.value || '');
  }
  if (prev === 's-my') renderMy();
}

function activeScreenEl() {
  return document.querySelector('.screen.active');
}

let ptrStartY = 0;
let ptrStartX = 0;
let ptrPulling = false;
let ptrRefreshing = false;

function setPullRefresh(show, text = '새로고침') {
  const el = document.getElementById('ptr');
  if (!el) return;
  el.querySelector('span').textContent = text;
  el.classList.toggle('show', show);
}

function canStartPullRefresh(e) {
  if (ptrRefreshing || e.touches.length !== 1) return false;
  const active = activeScreenEl();
  const screen = screenHistory[screenHistory.length - 1];
  if (!active || active.scrollTop > 2) return false;
  if (e.target.closest('input, textarea, select, button, .back-btn, .hbtn, .wish-btn, .img-zone, .photo-preview')) return false;
  if (screen === 's-det' && e.target.closest('.det-gallery, .det-img, img')) return false;
  return screen === 's-main' || screen === 's-my' || screen === 's-det';
}

async function refreshActiveScreen() {
  if (ptrRefreshing) return;
  ptrRefreshing = true;
  setPullRefresh(true, '새로고침 중...');
  try {
    if (screenHistory[screenHistory.length - 1] === 's-main') {
      await renderMain(document.getElementById('_sq')?.value || '', true);
    } else if (screenHistory[screenHistory.length - 1] === 's-my') {
      await renderMy();
    } else if (screenHistory[screenHistory.length - 1] === 's-det' && curId) {
      commentCache.delete(curId);
      const id = curId;
      await hydrateItemPhotos(id);
      await loadComments(id, true);
      if (curId === id) await openDet(id);
    }
    // 완료 표시를 1초간 보여준 뒤 숨김
    setPullRefresh(true, '✓ 완료');
    await new Promise(r => setTimeout(r, 900));
  } finally {
    ptrRefreshing = false;
    setPullRefresh(false);
  }
}

/* ── 새로고침 버튼 ── */
async function doManualRefresh(btn) {
  if (ptrRefreshing) return;
  if (btn) { btn.disabled = true; btn.querySelector('i')?.classList.add('spin'); }
  await refreshActiveScreen();
  if (btn) { btn.disabled = false; btn.querySelector('i')?.classList.remove('spin'); }

async function pollNotifications(silent = true) {
  if (!myN) return;
  const { data: myItems, error: itemError } = await sb
    .from('items')
    .select('id,title,description')
    .eq('seller_name', myN)
    .order('created_at', { ascending: false })
    .limit(200);
  if (itemError) { console.warn('알림 상품 조회 실패', itemError); return; }

  const owned = (myItems || []).filter(i => i.description !== DELETED_MARK);
  const ids = owned.map(i => i.id);
  const nextSeen = {};
  if (!ids.length) {
    // 상품이 없을 때 seen 상태를 {}로 덮어쓰면 다음 폴 때 모든 알림이 새것처럼 보임 — 저장 생략
    updateNotificationBadge();
    return;
  }

  const [likesRes, commentsRes] = await Promise.all([
    sb.from('likes').select('item_id').in('item_id', ids),
    sb.from('comments').select('id,item_id,author_name,content,created_at').in('item_id', ids),
  ]);
  if (likesRes.error) console.warn('알림 좋아요 조회 실패', likesRes.error);
  if (commentsRes.error) console.warn('알림 댓글 조회 실패', commentsRes.error);

  // 답글 알림: localStorage 캐시된 내 댓글 ID → targeted 쿼리 (Egress 절감)
  const myCmtIds = loadMyCmtIds();
  let replyComments = [];
  let replyQueryError = false;
  if (myCmtIds.length) {
    const { data: replyData, error: replyErr } = await sb
      .from('comments')
      .select('id,item_id,parent_id,author_name,content,created_at')
      .in('parent_id', myCmtIds)
      .neq('author_name', myN);
    if (replyErr) { replyQueryError = true; console.warn('답글 알림 조회 실패', replyErr); }
    else replyComments = replyData || [];
  }

  const titleById = new Map([
    ...cachedItems.map(i => [i.id, i.title || '상품']),
    ...owned.map(i => [i.id, i.title || '내 상품']),
  ]);
  const likes = new Map();
  (likesRes.data || []).forEach(l => likes.set(l.item_id, (likes.get(l.item_id) || 0) + 1));
  const replyIdSet = new Set(replyComments.map(c => c.id));
  const commentsByItem = new Map();
  (commentsRes.data || []).forEach(c => {
    if (!commentsByItem.has(c.item_id)) commentsByItem.set(c.item_id, []);
    commentsByItem.get(c.item_id).push(c);
  });

  const prevSeen = loadSeenEngagement();
  const firstRun = !prevSeen;
  const newNotis = [];
  // 답글 쿼리 실패 시 이전 기준 유지 (실패로 인한 재알림 방지)
  nextSeen._replies = replyQueryError
    ? ((prevSeen && prevSeen._replies) || [])
    : replyComments.map(c => c.id);
  ids.forEach(id => {
    const itemComments = commentsByItem.get(id) || [];
    const visibleComments = itemComments.filter(c => c.author_name !== myN);
    // 댓글 쿼리 실패 시 이전 기준 유지 (실패로 인한 재알림 방지)
    const commentIds = commentsRes.error
      ? ((prevSeen && prevSeen[id] && prevSeen[id].comments) || [])
      : visibleComments.map(c => c.id);
    nextSeen[id] = {
      likes: likes.get(id) || 0,
      comments: commentIds,
    };
    if (firstRun) return;

    const prev = prevSeen[id] || { likes: 0, comments: [] };
    const likeDelta = Math.max(0, nextSeen[id].likes - (prev.likes || 0));
    if (likeDelta) {
      newNotis.push({
        key: `like-${id}-${nextSeen[id].likes}`,
        item_id: id,
        title: titleById.get(id),
        message: `내 상품에 좋아요가 ${likeDelta}개 늘었어요.`,
      });
    }

    const oldCommentIds = new Set(prev.comments || []);
    visibleComments
      .filter(c => !oldCommentIds.has(c.id) && !replyIdSet.has(c.id))
      .forEach(c => newNotis.push({
        key: `comment-${c.id}`,
        item_id: id,
        title: titleById.get(id),
        message: `${c.author_name || '누군가'} 님이 댓글을 남겼어요: ${String(c.content || '').slice(0, 40)}`,
      }));
  });

  if (!firstRun) {
    const oldReplyIds = new Set(prevSeen._replies || []);
    replyComments
      .filter(c => !oldReplyIds.has(c.id))
      .forEach(c => newNotis.push({
        key: `reply-${c.id}`,
        item_id: c.item_id,
        title: titleById.get(c.item_id) || '댓글 단 상품',
        message: `${c.author_name || '누군가'} 님이 내 댓글에 답글을 남겼어요: ${String(c.content || '').slice(0, 40)}`,
      }));
  }

  /* ── 후기 댓글 / 후기 댓글 답글 알림 ── */
  try {
    // 내가 작성한 후기 ID 목록
    const { data: myRvs } = await sb.from('reviews').select('id,item_title').eq('reviewer_name', myN).limit(200);
    const myRvIds = (myRvs || []).map(r => r.id);
    const rvTitleById = new Map((myRvs || []).map(r => [r.id, r.item_title || '내 후기']));

    // 내 후기에 달린 댓글 (루트 댓글만, 내 것 제외)
    let rvRootCmts = [];
    if (myRvIds.length) {
      const { data: rvCmtsData } = await sb
        .from('review_comments')
        .select('id,review_id,author_name,content,parent_id,created_at')
        .in('review_id', myRvIds)
        .is('parent_id', null)
        .neq('author_name', myN)
        .order('created_at', { ascending: true });
      rvRootCmts = rvCmtsData || [];
    }

    // 내가 작성한 후기 댓글 ID → 그에 달린 답글
    let rvReplies = [];
    if (myRvIds.length) {
      const { data: myRvCmts } = await sb
        .from('review_comments')
        .select('id')
        .in('review_id', myRvIds)
        .eq('author_name', myN);
      const myRvCmtIds = (myRvCmts || []).map(c => c.id);
      if (myRvCmtIds.length) {
        const { data: repliesData } = await sb
          .from('review_comments')
          .select('id,review_id,author_name,content,parent_id,created_at')
          .in('parent_id', myRvCmtIds)
          .neq('author_name', myN);
        rvReplies = repliesData || [];
      }
    }

    nextSeen._rv_cmts = rvRootCmts.map(c => c.id);
    nextSeen._rv_replies = rvReplies.map(c => c.id);

    if (!firstRun) {
      const oldRvCmtIds = new Set(prevSeen._rv_cmts || []);
      rvRootCmts
        .filter(c => !oldRvCmtIds.has(c.id))
        .forEach(c => newNotis.push({
          key: `rv-cmt-${c.id}`,
          item_id: `rv:${c.review_id}`,
          title: rvTitleById.get(c.review_id) || '내 후기',
          message: `${c.author_name || '누군가'} 님이 후기에 댓글을 남겼어요: ${String(c.content || '').slice(0, 40)}`,
        }));

      const oldRvReplyIds = new Set(prevSeen._rv_replies || []);
      rvReplies
        .filter(c => !oldRvReplyIds.has(c.id))
        .forEach(c => newNotis.push({
          key: `rv-reply-${c.id}`,
          item_id: `rv:${c.review_id}`,
          title: rvTitleById.get(c.review_id) || '내 후기',
          message: `${c.author_name || '누군가'} 님이 내 후기 댓글에 답글을 남겼어요: ${String(c.content || '').slice(0, 40)}`,
        }));
    }
  } catch (e) { console.warn('후기 댓글 알림 조회 실패', e); }

  saveSeenEngagement(nextSeen);
  if (newNotis.length && !silent) addNotifications(newNotis);
  else if (newNotis.length) addNotifications(newNotis);
  else updateNotificationBadge();
}

document.getElementById('app').addEventListener('touchstart', e => {
  if (!canStartPullRefresh(e)) return;
  ptrStartX = e.touches[0].clientX;
  ptrStartY = e.touches[0].clientY;
  ptrPulling = true;
}, { passive: true });

document.getElementById('app').addEventListener('touchmove', e => {
  if (!ptrPulling || ptrRefreshing || e.touches.length !== 1) return;
  const active = activeScreenEl();
  if (!active || active.scrollTop > 2) { ptrPulling = false; setPullRefresh(false); return; }
  const dx = Math.abs(e.touches[0].clientX - ptrStartX);
  const dy = e.touches[0].clientY - ptrStartY;
  if (dx > 28 || dy < 0) { ptrPulling = false; setPullRefresh(false); return; }
  if (dy > 40) setPullRefresh(true, dy > 60 ? '놓으면 새로고침' : '당겨서 새로고침');
}, { passive: true });

document.getElementById('app').addEventListener('touchend', e => {
  if (ptrRefreshing) { ptrPulling = false; return; }
  if (!ptrPulling) { setPullRefresh(false); return; }
  ptrPulling = false;
  const dx = Math.abs((e.changedTouches[0]?.clientX || 0) - ptrStartX);
  const dy = (e.changedTouches[0]?.clientY || 0) - ptrStartY;
  if (dy > 60 && dx < 28) refreshActiveScreen();
  else setPullRefresh(false);
}, { passive: true });

document.getElementById('app').addEventListener('touchcancel', () => {
  ptrPulling = false;
  setPullRefresh(false);
}, { passive: true });

/* ── 상태바(Dynamic Island / 시계 영역) 탭 → 맨 위로 스크롤 ──
   Safari와 동일한 원리: html을 1px 스크롤 가능하게 유지하고
   status bar tap → window.scrollY 가 0이 되는 순간 scroll 이벤트로 감지. */
(function () {
  // html 스크롤을 항상 1px로 유지 (status bar tap 시 0으로 떨어지는 것 감지)
  function _initScroll() { window.scrollTo(0, 1); }
  requestAnimationFrame(_initScroll);

  let _busy = false;
  window.addEventListener('scroll', function () {
    if (_busy || window.scrollY >= 1) return;
    // scrollY가 0이 됐다 = status bar 탭
    const active = activeScreenEl();
    if (active) active.scrollTo({ top: 0, behavior: 'smooth' });
    _busy = true;
    requestAnimationFrame(function () {
      window.scrollTo(0, 1);          // 1px로 복원
      requestAnimationFrame(function () { _busy = false; });
    });
  }, { passive: true });
}());

/* ── 파일 업로드 → Base64 ── */
function readFile(file) {
  return new Promise(res => {
    const r = new FileReader();
    r.onload = e => res(e.target.result);
    r.readAsDataURL(file);
  });
}
function readItemImage(file, max = 900, quality = .78) {
  return new Promise(res => {
    const r = new FileReader();
    r.onload = e => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, max / Math.max(img.width, img.height));
        const w = Math.round(img.width * scale);
        const h = Math.round(img.height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        res(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => res(e.target.result);
      img.src = e.target.result;
    };
    r.readAsDataURL(file);
  });
}
function makeThumbFromDataUrl(src, max = 360, quality = .68) {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const w = Math.round(img.width * scale);
      const h = Math.round(img.height * scale);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      res(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => res(src);
    img.src = src;
  });
}
function dataUrlToBlob(dataUrl) {
  const [head, body] = dataUrl.split(',');
  const mime = (head.match(/data:(.*?);/) || [])[1] || 'image/jpeg';
  const bin = atob(body || '');
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new Blob([bytes], { type: mime });
}
async function uploadImageDataUrl(dataUrl, folder = 'items') {
  if (isImgUrl(dataUrl)) return dataUrl;
  const blob = dataUrlToBlob(dataUrl);
  const key = `${folder}/${userKey}/${Date.now()}-${crypto.randomUUID()}.jpg`;
  const formData = new FormData();
  formData.append('file', blob, 'image.jpg');
  formData.append('key', key);
  const res = await fetch('https://gurogu-upload.yhj6350.workers.dev', {
    method: 'POST',
    headers: { 'X-Upload-Token': 'gurogu2026' },
    body: formData,
  });
  if (!res.ok) {
    const err = await res.text();
    throw new Error('이미지 업로드 실패: ' + err);
  }
  const { url } = await res.json();
  return url;
}
async function uploadItemImages(photos, thumbs) {
  const photoUrls = [];
  for (const photo of photos) {
    photoUrls.push(isImgUrl(photo) ? photo : await uploadImageDataUrl(photo, 'items'));
  }

  let thumbnailUrl = '';
  if (thumbs[0]) {
    thumbnailUrl = isImgUrl(thumbs[0]) ? thumbs[0] : await uploadImageDataUrl(thumbs[0], 'thumbs');

async function restRows(path, ms = 6000) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), ms);
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
      headers: {
        apikey: SUPABASE_KEY,
        authorization: `Bearer ${SUPABASE_KEY}`,
      },
      signal: controller.signal,
    });
    const text = await res.text();
    return {
      data: res.ok ? JSON.parse(text || '[]') : null,
      error: res.ok ? null : JSON.parse(text || '{}'),
    };
  } catch (e) {
    return { data: null, error: e };
  } finally {
    clearTimeout(timer);
  }
}

function _processItems(data) {
  return data
    .filter(i => i.description !== DELETED_MARK)
    .sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0))
    .map(i => ({
      ...i,
      emoji: itemRecordPayload(i) || i.emoji || cachedThumbPayload(i.id),
      seller_photo: i.seller_photo || '',
      likeCount: i.likeCount || 0,
      commentCount: i.commentCount || 0,
    }));
}

async function fetchItems(force = false) {
  // force=true 이면 Worker 캐시를 건너뛰고 DB에서 직접 가져옴
  // 경로 1: Cloudflare Worker (캐시 우선, 빠름) — 강제 새로고침 시 스킵
  const workerPromise = force ? Promise.resolve(null) : (async () => {
    try {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), 3500);
      const res = await fetch(`${WORKER_URL}/items`, { signal: ctrl.signal });
      clearTimeout(t);
      if (res.ok) {
        const data = await res.json();
        if (Array.isArray(data) && data.length > 0) return _processItems(data);
      }
    } catch (e) { console.warn('Worker 실패:', e.message); }
    return null;
  })();

  // 경로 2: Supabase JS 클라이언트
  const sbPromise = (async () => {
    try {
      const query = sb.from('items')
        .select(ITEM_LIST_COLS)
        .order('created_at', { ascending: false })
        .limit(200);
      const { data, error } = await Promise.race([
        query,
        new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), force ? 8000 : 4500)),
      ]);
      if (!error && data && data.length > 0) return _processItems(data);
      if (error) console.warn('Supabase JS 실패:', error.message);
    } catch (e) { console.warn('Supabase JS 예외:', e.message); }
    return null;
  })();

  // 경로 3: Supabase REST API 직접 호출
  const restPromise = (async () => {
    try {
      const res = await restRows(`items?select=${encodeURIComponent(ITEM_LIST_COLS)}&limit=200&order=created_at.desc`, force ? 8000 : 4500);
      if (!res.error && res.data && res.data.length > 0) return _processItems(res.data);
      if (res.error) console.warn('REST 실패:', JSON.stringify(res.error));
    } catch (e) { console.warn('REST 예외:', e.message); }
    return null;
  })();

  const toResult = p => p.then(v => v !== null ? v : Promise.reject('no data'));
  return Promise.any([toResult(workerPromise), toResult(sbPromise), toResult(restPromise)]).catch(() => null);
}

function withTimeout(promise, ms, fallback = null) {
  return Promise.race([
    promise,
    new Promise(resolve => setTimeout(() => resolve(fallback), ms)),
  ]);
}

function mergeFetchedItems(freshItems) {
  const oldById = new Map(cachedItems.map(i => [i.id, i]));
  const freshIdSet = new Set(freshItems.map(i => i.id));
  const merged = freshItems.map(i => {
    const old = oldById.get(i.id);
    if (!old) return i;
    const oldHasMedia = itemThumbList(old.emoji).length || itemPhotoList(old.emoji).length;
    const freshHasMedia = itemThumbList(i.emoji).length || itemPhotoList(i.emoji).length;
    return {
      ...i,
      emoji: oldHasMedia && !freshHasMedia ? old.emoji : i.emoji,
      seller_photo: old.seller_photo || i.seller_photo,
      likeCount: old.likeCount || i.likeCount || 0,
      commentCount: old.commentCount || i.commentCount || 0,
    };
  });
  // Worker 캐시가 오래돼서 freshItems에 없는 로컬 신규 상품도 유지
  const extras = cachedItems.filter(i =>
    !freshIdSet.has(i.id) &&
    i.description !== DELETED_MARK &&
    i.title !== '삭제된 상품'
  );
  if (!extras.length) return merged;
  return [...merged, ...extras].sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));
}

async function fetchItemCounts(items) {
  const ids = items.map(i => i.id);
  const empty = { likes: new Map(), comments: new Map() };

  const [likesRes, commentsRes] = await Promise.all([
    sb.from('likes').select('item_id').in('item_id', ids),
    sb.from('comments').select('item_id').in('item_id', ids),
  ]);
  if (likesRes.error || commentsRes.error) {
    console.error(likesRes.error || commentsRes.error);
    return null;
  }

  const likes = new Map();
  const comments = new Map();
  (likesRes.data || []).forEach(l => likes.set(l.item_id, (likes.get(l.item_id) || 0) + 1));
  (commentsRes.data || []).forEach(c => comments.set(c.item_id, (comments.get(c.item_id) || 0) + 1));
  return { likes, comments };
}

function prefetchVisibleDetails(q) {

  const visible = visibleIds.length

    : all.slice(0, 16);
  const missing = visible
    .filter(i => !(itemThumbList(i.emoji).length || itemPhotoList(i.emoji).length) && !photoHydrationPromises.has(i.id))
    .map(i => i.id);
  hydrateVisiblePhotoBatch(missing, q);
  visible
    .filter(i => itemThumbList(i.emoji).length || itemPhotoList(i.emoji).length)
    .forEach(i => hydrateItemPhotos(i.id, q));
}

function visibleCardIds() {
  const screen = document.getElementById('s-main');
  if (!screen) return [];
  const sr = screen.getBoundingClientRect();
  const top = sr.top - 450;
  const bottom = sr.bottom + 700;
  return [...document.querySelectorAll('#s-main .card[data-id]')]
    .filter(card => {
      const r = card.getBoundingClientRect();
      return r.bottom >= top && r.top <= bottom;
    })
    .map(card => card.dataset.id)
    .filter(Boolean);
}

async function hydrateVisiblePhotoBatch(ids, q) {
  const targets = ids.filter(id => !hydratedPhotoIds.has(id) && !photoHydrationPromises.has(id));
  if (!targets.length) return;
  targets.forEach(id => hydratingPhotoIds.add(id));
  const inFilter = `in.(${targets.join(',')})`;
  const columnSets = [
    'id,emoji,category,thumbnail_url,photo_urls',
    'id,emoji,category,thumbnail_url',
    'id,emoji,category',
  ];
  let rows = null;
  let error = null;
  for (const columns of columnSets) {
    const res = await restRows(`items?select=${encodeURIComponent(columns)}&id=${encodeURIComponent(inFilter)}&limit=${targets.length}`, 10000);
    rows = res.data;
    error = res.error;
    if (!error) break;
    if (error.code !== '42703') break;
  }
  targets.forEach(id => hydratingPhotoIds.delete(id));
  if (error || !rows) {
    targets.forEach(id => hydrateItemPhotos(id, q));
    return;
  }

  const byId = new Map(rows.map(r => [r.id, r]));
  let changed = false;
  cachedItems = cachedItems.map(item => {
    const data = byId.get(item.id);
    if (!data) return item;
    const nextEmoji = itemRecordPayload(data) || data.emoji || item.emoji || emM[data.category || item.category || '기타'] || '📦';
    const thumbs = itemThumbList(nextEmoji);
    if (thumbs[0]) rememberItemThumbs(item.id, thumbs);
    hydratedPhotoIds.add(item.id);
    changed = true;
    return {
      ...item,
      ...data,
      emoji: nextEmoji || item.emoji,
      seller_photo: item.seller_photo || '',
      likeCount: item.likeCount ?? 0,
      commentCount: item.commentCount ?? 0,
    };
  });
  if (changed) targets.forEach(id => updateCardThumb(id));
}

async function hydrateItemPhotos(id, q) {
  const existing = cachedItems.find(i => i.id === id);
  const hasFullPhotos = itemPhotoList(existing?.emoji).length && !isThumbOnlyPayload(existing?.emoji);
  if (hydratedPhotoIds.has(id) || hasFullPhotos) return existing;
  if (photoHydrationPromises.has(id)) return photoHydrationPromises.get(id);

  const promise = (async () => {
    hydratingPhotoIds.add(id);
    const columnSets = [
      'id,emoji,category,thumbnail_url,photo_urls',
      'id,emoji,category,thumbnail_url',
      'id,emoji,category',
    ];
    let data = null;
    let error = null;
    for (const columns of columnSets) {
      const res = await restRows(`items?select=${encodeURIComponent(columns)}&id=eq.${encodeURIComponent(id)}&limit=1`);
      data = (res.data || [])[0] || null;
      error = res.error;
      if (!error) break;
      if (error.code !== '42703') break;
    }
    hydratingPhotoIds.delete(id);
    if (error || !data) return existing;

    let nextEmoji = itemRecordPayload(data) || data.emoji || emM[data.category || existing?.category || '기타'] || '📦';
    const photos = itemPhotoList(nextEmoji);
    let thumbs = itemThumbList(nextEmoji);
    if (photos.length && (!thumbs.length || thumbs[0] === photos[0] || thumbs[0].length > 140000 || thumbs.length < photos.length)) {
      thumbs = await Promise.all(photos.map(p => makeThumbFromDataUrl(p)));
      nextEmoji = itemPayload(photos, data.category || existing?.category || '기타', thumbs);
      sb.from('items').update({ emoji: nextEmoji }).eq('id', id).then(({ error }) => {
        if (error) console.warn('썸네일 저장 실패', error);
      });
    }
    if (thumbs[0]) rememberItemThumbs(id, thumbs);
    hydratedPhotoIds.add(id);

    let merged = existing;
    cachedItems = cachedItems.map(i => {
      if (i.id !== id) return i;
      merged = {
        ...i,
        ...data,
        emoji: nextEmoji,
        seller_photo: i.seller_photo || existing?.seller_photo || '',
        likeCount: i.likeCount ?? existing?.likeCount ?? 0,
        commentCount: i.commentCount ?? existing?.commentCount ?? 0,
      };
      return merged;
    });
    updateCardThumb(id);
    return merged;
  })();

  photoHydrationPromises.set(id, promise);
  promise.finally(() => photoHydrationPromises.delete(id));
  return promise;
}

function selectCategory(category) {
  catF = category;
  try { localStorage.setItem('gurogu_catF', category); } catch (e) {}
  document.querySelectorAll('#s-main .chip').forEach(chip => {
    chip.classList.toggle('on', chip.dataset.cat === category);
  });
  renderMainList(document.getElementById('_sq')?.value || '');
}

function selectStatus(status) {
  statF = status;
  try { localStorage.setItem('gurogu_statF', status); } catch (e) {}
  document.querySelectorAll('#s-main .stab').forEach(tab => {
    tab.classList.toggle('on', tab.dataset.stat === status);
  });
  if (status === '후기') {
    renderReviews();
  } else {
    const content = document.querySelector('#s-main .content');
    if (content && !content.querySelector('.grid')) {
      // 후기 탭에서 전환 시 그리드가 없음 — 스피너로 채워두고 renderMainList 호출
      content.innerHTML = '<div class="grid"><div class="loading"><div class="spin"></div> 불러오는 중...</div></div>';
    }
    renderMainList(document.getElementById('_sq')?.value || '');
  }
}

function updateCardThumb(id) {

  const item = cachedItems.find(i => i.id === id);

function renderMainList(q, shouldPrefetch = true) {
  if (statF === '후기') return;
  q = q !== undefined ? q : (document.getElementById('_sq')?.value || '');

  let list = filterMainItems(q);

  const grid = document.querySelector('#s-main .grid');
  if (!grid) return;
  if (!cachedItems.length) {
    // 아직 데이터 로딩 중 — 스피너 유지 (백그라운드 fetch 완료 시 자동 re-render)
    grid.innerHTML = '<div class="loading"><div class="spin"></div> 불러오는 중...</div>';
    return;
  }
  if (list.length) {
    grid.innerHTML = list.map(i => cardH(i, likedItemIds.has(i.id))).join('');
  } else {
    let emptyMsg;
    if (q) emptyMsg = `"${q}" 검색 결과가 없어요`;
    else if (catF !== '전체') emptyMsg = `${catF} 카테고리에 상품이 없어요 🙂`;
    else if (statF === '판매중') emptyMsg = '판매 중인 상품이 없어요';
    else if (statF === '판매완료') emptyMsg = '판매 완료된 상품이 없어요';
    else emptyMsg = '상품이 없어요';
    grid.innerHTML = `<div class="empty-state">${emptyMsg}</div>`;
  }
  if (shouldPrefetch) prefetchSoon(q);
}

let prefetchTimer;
function prefetchSoon(q) {
  clearTimeout(prefetchTimer);
  prefetchTimer = setTimeout(() => prefetchVisibleDetails(q), 80);
}

function attachMainScrollHydration() {
  const screen = document.getElementById('s-main');
  if (!screen || screen._photoHydrationAttached) return;
  screen._photoHydrationAttached = true;
  screen.addEventListener('scroll', () => {
    if (statF === '후기') return;
    prefetchSoon(document.getElementById('_sq')?.value || '');
  }, { passive: true });
}

function filterMainItems(q) {
  q = q !== undefined ? q : (document.getElementById('_sq')?.value || '');
  return cachedItems.filter(i => {
    const mc = catF === '전체' || i.category === catF;
    const ms = statF === '전체' || (statF === '판매중' && !i.sold) || (statF === '판매완료' && i.sold);
    const mq = !q || String(i.title || '').includes(q);
    return mc && ms && mq;
  });
}

function renderStarsHtml(rating) {
  let html = '';
  for (let i = 1; i <= 5; i++) {
    if (rating >= i) html += '<span class="rv-star full">★</span>';
    else if (rating >= i - 0.5) html += '<span class="rv-star half">★</span>';
    else html += '<span class="rv-star">★</span>';
  }
  return html;
}

function applyReviewTabBadge(reviews) {
  const rvTab = document.querySelector('#s-main .stab[data-stat="후기"]');
  if (!rvTab) return;
  const cnt = reviews.length;
  const seenAt = (() => { try { return parseInt(localStorage.getItem('gurogu_rv_seen_at') || '0'); } catch (_) { return 0; } })();
  const newCount = reviews.filter(r => new Date(r.created_at).getTime() > seenAt).length;
  const newBadge = (newCount > 0 && seenAt > 0) ? `<span class="rv-tab-new">${newCount > 9 ? '9+' : newCount}</span>` : '';
  rvTab.innerHTML = `후기<span class="rv-tab-cnt">${cnt}</span>${newBadge}`;
  if (statF === '후기') {
    try { localStorage.setItem('gurogu_rv_seen_at', Date.now()); } catch (_) {}
  }
}

  const { data } = await sb.from('reviews').select('id,created_at');
  if (data) applyReviewTabBadge(data);
}

async function fetchReviewsBundle() {
  const fallback = {
    rvResp: { data: null, error: new Error('reviews timeout') },
    likesResp: { data: [], error: null },
    cmtsResp: { data: [], error: null },
    itemsResp: { data: [], error: null },
  };

  const workerPromise = (async () => {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 2500);
    try {
      const res = await fetch(`${WORKER_URL}/reviews`, { signal: ctrl.signal });
      if (!res.ok) throw new Error(`Worker reviews ${res.status}`);
      const data = await res.json();
      return {
        rvResp: { data: data.reviews || [], error: null },
        likesResp: { data: data.likes || [], error: null },
        cmtsResp: { data: data.comments || [], error: null },
        itemsResp: { data: data.items || [], error: null },
      };
    } finally {
      clearTimeout(timer);
    }
  })();

  const directPromise = Promise.all([
    sb.from('reviews').select('*').order('created_at', { ascending: false }),
    sb.from('review_likes').select('review_id,user_name'),
    sb.from('review_comments').select('review_id'),
    sb.from('items').select('title,seller_name'),
  ]).then(([rvResp, likesResp, cmtsResp, itemsResp]) => ({ rvResp, likesResp, cmtsResp, itemsResp }));

  try {
    return await Promise.any([workerPromise, directPromise]);
  } catch (e) {
    console.warn('후기 로딩 실패:', e);
    return fallback;
  }
}

/* ── 피드 렌더링 ── */
async function renderReviews() {
  const content = document.querySelector('#s-main .content');
  if (!content) return;

  // 캐시 있으면 즉시 표시, 없으면 로딩 스피너
  if (cachedReviews) {
    content.innerHTML = `<div class="review-feed">
      <button class="rv-write-btn" onclick="openReviewForm()"><i class="ti ti-pencil-plus" aria-hidden="true"></i> 후기 쓰기</button>
      ${_buildReviewFeedHtml(cachedReviews)}
    </div>`;
  } else {
    content.innerHTML = `<div class="review-feed">
      <button class="rv-write-btn" onclick="openReviewForm()"><i class="ti ti-pencil-plus" aria-hidden="true"></i> 후기 쓰기</button>
      <div class="loading"><div class="spin"></div> 불러오는 중...</div>
    </div>`;
  }

  const { rvResp, likesResp, cmtsResp, itemsResp } = await fetchReviewsBundle();

  const feed = document.querySelector('#s-main .review-feed');
  if (!feed) return;

  if (rvResp.error) {
    if (!cachedReviews) {
      feed.innerHTML = `
        <button class="rv-write-btn" onclick="openReviewForm()"><i class="ti ti-pencil-plus" aria-hidden="true"></i> 후기 쓰기</button>
        <div class="rv-empty">후기를 불러오지 못했어요 🥲</div>`;
    }
    return;
  }

  const reviews = rvResp.data || [];
  const likes   = likesResp.data || [];
  const cmts    = cmtsResp.data || [];

  const likeMap = {};
  likes.forEach(l => { likeMap[l.review_id] = (likeMap[l.review_id] || 0) + 1; });
  const myLikedSet = new Set(likes.filter(l => l.user_name === myN).map(l => l.review_id));
  const cmtMap = {};
  cmts.forEach(c => { cmtMap[c.review_id] = (cmtMap[c.review_id] || 0) + 1; });

  const titleToSeller = {};
  (itemsResp.data || []).forEach(i => { if (i.title) titleToSeller[i.title] = i.seller_name; });
  Object.assign(titleToSellerMap, titleToSeller);

  applyReviewTabBadge(reviews);

  cachedReviews = { reviews, likeMap, myLikedSet: [...myLikedSet], cmtMap, titleToSeller };
  _saveReviewsCache(cachedReviews);

  feed.innerHTML = `
    <button class="rv-write-btn" onclick="openReviewForm()"><i class="ti ti-pencil-plus" aria-hidden="true"></i> 후기 쓰기</button>
    ${_buildReviewFeedHtml({ reviews, likeMap, myLikedSet, cmtMap, titleToSeller })}`;
}

function _buildReviewFeedHtml({ reviews, likeMap, myLikedSet, cmtMap, titleToSeller }) {
  if (!reviews || !reviews.length) {
    return '<div class="rv-empty">아직 후기가 없어요<br>첫 구매 후기를 남겨보세요! ✨</div>';
  }
  const likedSet = myLikedSet instanceof Set ? myLikedSet : new Set(myLikedSet);
  return reviews.map(r =>
    reviewCardH(r, likeMap[r.id] || 0, likedSet.has(r.id), cmtMap[r.id] || 0, titleToSeller[r.item_title] || '')
  ).join('');
}

/* ── 사진 캐러셀 카운터 업데이트 ── */

/* ── 좋아요 토글 ── */
async function toggleReviewLike(reviewId, btn) {
  const span = btn.querySelector('span');
  const isLiked = btn.classList.contains('liked');
  const newCount = isLiked
    ? Math.max(0, parseInt(span.textContent || '0') - 1)
    : parseInt(span.textContent || '0') + 1;
  const newEmoji = isLiked ? '🤍' : '❤️';
  try {
    if (isLiked) {
      await sb.from('review_likes').delete().eq('review_id', reviewId).eq('user_name', myN);
    } else {
      await sb.from('review_likes').insert({ review_id: reviewId, user_name: myN });
    }
    btn.classList.toggle('liked', !isLiked);
    btn.innerHTML = `${newEmoji} <span>${newCount}</span>`;
    // 카드 목록의 같은 후기 좋아요 버튼도 동기화
    const cardLikeBtn = document.querySelector(`[data-rid="${reviewId}"] .rv-act-btn.${isLiked ? 'liked' : 'rv-act-btn'}`);
    const cardBtn = document.querySelector(`[data-rid="${reviewId}"] .rv-act-btn:first-child`);
    if (cardBtn && cardBtn !== btn) {
      cardBtn.classList.toggle('liked', !isLiked);
      cardBtn.innerHTML = `${newEmoji} <span>${newCount}</span>`;
    }
    // 상세 모달 좋아요 버튼도 동기화
    const detBtn = document.getElementById('_rvDetLikeBtn');
    if (detBtn && detBtn !== btn) {
      detBtn.classList.toggle('liked', !isLiked);
      detBtn.innerHTML = `${newEmoji} <span>${newCount}</span>`;
    }

/* ── 후기 사진 카운터 ── */
function updateRvDetPhotoCounter(track, total) {
  if (!track || total <= 1) return;
  const cnt = document.getElementById('_rvPhotoCnt');
  if (!cnt) return;
  const idx = Math.round(track.scrollLeft / track.offsetWidth);
  cnt.textContent = `${idx + 1}/${total}`;
}

/* ── 댓글 상세 화면 ── */
async function openReviewDetail(reviewId) {
  if (document.getElementById('_rvDetModal')) return;
  const modal = document.createElement('div');
  modal.className = 'rv-det-modal'; modal.id = '_rvDetModal';
  modal._reviewId = reviewId;
  modal.innerHTML = `
    <div class="rv-det-hdr">
      <button class="back-btn" onclick="closeReviewDetail()" aria-label="뒤로"><i class="ti ti-arrow-left"></i></button>
      <h3>후기 댓글</h3>
    </div>
    <div class="rv-det-body" id="_rvDetBody">
      <div class="loading" style="padding:30px 0;text-align:center"><div class="spin"></div> 불러오는 중...</div>
    </div>
    <div class="rv-cmt-bar">
      <textarea id="_rvCmtInput" placeholder="댓글을 남겨주세요" maxlength="300" rows="1" oninput="autoGrow(this)" onkeydown="if(event.key==='Enter'&&!event.shiftKey&&!event.isComposing&&!('ontouchstart' in document)){event.preventDefault();submitRvComment('${reviewId}')}"></textarea>
      <button class="rv-cmt-send" onclick="submitRvComment('${reviewId}')">전송</button>
    </div>`;
  document.body.appendChild(modal);

  const [rvResp, cmtsResp, rvLikesResp] = await Promise.all([
    sb.from('reviews').select('*').eq('id', reviewId).single(),
    sb.from('review_comments').select('*').eq('review_id', reviewId).order('created_at', { ascending: true }),
    sb.from('review_likes').select('user_name').eq('review_id', reviewId),
  ]);
  const r = rvResp.data;
  _currentReviewAuthor = r?.reviewer_name || r?.author_name || null;
  _currentReviewItemTitle = r?.item_title || null;
  const allCmts = cmtsResp.data || [];
  const rvLikes = rvLikesResp.data || [];
  const rvLikeCount = rvLikes.length;
  const rvILiked = rvLikes.some(l => l.user_name === myN);
  // 댓글 ID 목록으로 좋아요 가져오기
  const cmtIds = allCmts.map(c => c.id);
  let likesData = [];
  if (cmtIds.length) {
    const { data: ld } = await sb.from('review_comment_likes').select('comment_id,user_name').in('comment_id', cmtIds);
    likesData = ld || [];
  }
  const body = document.getElementById('_rvDetBody');
  if (!body || !r) return;

  // 좋아요 집계
  const cmtLikeMap = {};
  const myLikedCmts = new Set();
  likesData.forEach(l => {
    cmtLikeMap[l.comment_id] = (cmtLikeMap[l.comment_id] || 0) + 1;
    if (l.user_name === myN) myLikedCmts.add(l.comment_id);
  });

  // 루트 댓글 / 답글 분리
  const roots = allCmts.filter(c => !c.parent_id);
  const replyMap = {};
  allCmts.filter(c => c.parent_id).forEach(c => {
    if (!replyMap[c.parent_id]) replyMap[c.parent_id] = [];
    replyMap[c.parent_id].push(c);
  });

  const photos = (r.photo_urls && r.photo_urls.length) ? r.photo_urls : (r.photo_url ? [r.photo_url] : []);
  let photoHtml = '';
  if (photos.length) {
    const cleanPhotos = uniquePhotoRefs(photos);
    const photosJson = JSON.stringify(cleanPhotos);
    if (cleanPhotos.length === 1) {
      photoHtml = `<div class="rv-photo-slider"><div class="rv-photo-track"><div class="rv-photo-slide" onclick="openPhotoModal(${jsStr(cleanPhotos[0])},${esc(photosJson)},0)">${fallbackImgHtml(cleanPhotos, '후기 사진', '기타', 'eager')}</div></div></div>`;
    } else {
      const slides = cleanPhotos.map((p, i) =>
        `<div class="rv-photo-slide" onclick="openPhotoModal(${jsStr(p)},${esc(photosJson)},${i})">${fallbackImgHtml([p], `사진 ${i + 1}`, '기타', 'eager')}</div>`
      ).join('');
      photoHtml = `<div class="rv-photo-slider" id="_rvPhotoSlider">
        <div class="rv-photo-track" id="_rvPhotoTrack" onscroll="updateRvDetPhotoCounter(this,${cleanPhotos.length})">${slides}</div>
        <div class="rv-photo-counter" id="_rvPhotoCnt">1/${cleanPhotos.length}</div>
      </div>`;
    }
  }

  body.innerHTML = `
    <div class="rv-det-review">
      ${photoHtml}
      <div style="padding:${photos.length?'12px 0 0':'0'}">
        <div class="rv-top" style="margin-bottom:8px">
          <div class="rv-av">${av(r.reviewer_photo || '', r.reviewer_name, 30)}</div>
          <div class="rv-top-info">
            <span class="rv-name">${esc(r.reviewer_name)}</span>
            <span class="rv-time">${relTime(r.created_at)}</span>
          </div>
        </div>
        ${r.item_title ? `<div class="rv-item-tag">🛍️ ${esc(r.item_title)}${titleToSellerMap[r.item_title] ? ` · ${esc(titleToSellerMap[r.item_title])}` : ''}</div>` : ''}
        <div class="rv-stars-disp" style="margin:5px 0">${renderStarsHtml(r.rating || 0)}</div>
        <div style="font-size:13px;color:var(--text2);line-height:1.6">${escLines(r.content)}</div>
        <div class="rv-actions" style="margin-top:12px;padding-top:10px;border-top:.5px solid var(--br)">
          <button class="rv-act-btn${rvILiked ? ' liked' : ''}" id="_rvDetLikeBtn" onclick="toggleReviewLike('${reviewId}',this)">
            ${rvILiked ? '❤️' : '🤍'} <span>${rvLikeCount}</span>
          </button>
        </div>
      </div>
    </div>
    <div class="rv-det-comments" id="_rvCmtList">
      ${roots.length
        ? roots.map(c => rvCmtHtml(c, cmtLikeMap[c.id] || 0, myLikedCmts.has(c.id), replyMap[c.id] || [], reviewId)).join('')
        : '<div style="text-align:center;padding:20px 0;color:var(--text3);font-size:13px;font-weight:700">아직 댓글이 없어요. 첫 댓글을 남겨보세요!</div>'}
    </div>`;
}

function rvCmtHtml(c, likeCount = 0, iLiked = false, replies = [], reviewId = '') {
  const ismine = c.author_name === myN;
  const actBtns = `
    <div class="rv-cmt-acts">
      <button class="rv-cmt-act${iLiked ? ' liked' : ''}" onclick="toggleRvCmtLike('${c.id}',this)">

      </button>
      <button class="rv-cmt-act" onclick="toggleRvCmtReplyForm('${c.id}')">↩ 답글</button>
      ${ismine ? `<button class="rv-cmt-act" onclick="editRvCmt('${c.id}')">수정</button>
      <button class="rv-cmt-act" style="color:#E53935" onclick="deleteRvCmt('${c.id}','${reviewId}')">삭제</button>` : ''}
    </div>`;

  const repliesHtml = replies.length ? `
    <div class="rv-cmt-replies">
      ${replies.map(r => `
        <div class="rv-cmt-rep" id="rvrep-${r.id}">
          <div class="rv-rep-av">${av(r.author_photo || '', r.author_name, 20)}</div>
          <div class="rv-rep-bubble">
            <div class="rv-rep-name">${esc(r.author_name)}${r.author_name === myN ? ` <button style="font-size:9px;color:#E53935;border:none;background:none;cursor:pointer;font-weight:700;font-family:inherit;padding:0" onclick="deleteRvCmt('${r.id}','${reviewId}')">삭제</button>` : ''}</div>
            <div class="rv-rep-text">${escLines(r.content)}</div>
            <div class="rv-rep-time">${relTime(r.created_at)}</div>
          </div>
        </div>`).join('')}
    </div>` : '';

  const replyForm = `
    <div class="rv-cmt-rep-form" id="rvrepform-${c.id}">
      <textarea class="rv-cmt-rep-inp" id="rvrepinp-${c.id}" placeholder="답글을 남겨보세요" maxlength="200" rows="1" oninput="autoGrow(this)" onkeydown="if(event.key==='Enter'&&!event.shiftKey&&!event.isComposing&&!('ontouchstart' in document)){event.preventDefault();submitRvReply('${c.id}','${reviewId}')}"></textarea>
      <button class="rv-cmt-rep-post" onclick="submitRvReply('${c.id}','${reviewId}')">등록</button>
    </div>`;

  return `<div class="rv-cmt-item" id="rvcmt-${c.id}" data-author="${esc(c.author_name)}">
    <div class="rv-cmt-av">${av(c.author_photo || '', c.author_name, 26)}</div>
    <div class="rv-cmt-bubble">
      <div class="rv-cmt-name">${esc(c.author_name)}</div>
      <div class="rv-cmt-text" id="rvtxt-${c.id}">${escLines(c.content)}</div>
      <div class="rv-cmt-time">${relTime(c.created_at)}</div>
      ${actBtns}
      ${repliesHtml}
      ${replyForm}
    </div>
  </div>`;
}

let _rvCmtPending = false;
async function submitRvComment(reviewId) {
  if (_rvCmtPending) return;
  const input = document.getElementById('_rvCmtInput');
  const text = input?.value.trim();
  if (!text) { toast('댓글을 입력해주세요'); return; }
  _rvCmtPending = true;
  if (input) { input.value = ''; input.style.height = ''; }  // ← await 전에 즉시 비워서 중복 방지
  const sendBtn = document.querySelector('#_rvDetModal .rv-cmt-send');
  if (sendBtn) sendBtn.disabled = true;
  try {
    const { data, error } = await sb.from('review_comments').insert({
      review_id: reviewId,
      author_name: myN,
      author_photo: myP || null,
      content: text,
    }).select().single();
    if (error) throw error;
    const list = document.getElementById('_rvCmtList');
    if (list) {
      if (list.querySelector('div[style*="center"]')) list.innerHTML = '';
      list.insertAdjacentHTML('beforeend', rvCmtHtml(data, 0, false, [], reviewId));
      list.lastElementChild?.scrollIntoView({ behavior: 'smooth' });
    }
    // 푸시 알림 — 후기 작성자에게
    if (_currentReviewAuthor && _currentReviewAuthor !== myN) {
      const _rvIt = _currentReviewItemTitle ? `'${_currentReviewItemTitle}' ` : '';
      sendPushToUser(_currentReviewAuthor, `${_rvIt}후기 댓글`, `${myN}: ${text.slice(0, 60)}`, `rv:${reviewId}`);
    }
    // 카드 댓글 수 업데이트
    const card = document.querySelector(`[data-rid="${reviewId}"] .rv-act-btn:last-child span`);
    if (card) card.textContent = String(parseInt(card.textContent || '0') + 1);
  } catch (e) {
    console.error('댓글 실패', e);
    toast('댓글 등록에 실패했어요');
    if (input) input.value = text;   // 실패 시 입력값 복원
  } finally {
    _rvCmtPending = false;
    if (sendBtn) sendBtn.disabled = false;
  }
}

function closeReviewDetail() {
  document.getElementById('_rvDetModal')?.remove();
  _rvCmtPending = false;
}

/* ── 후기 댓글 좋아요 ── */
async function toggleRvCmtLike(cmtId, btn) {
  const span = btn.querySelector('span');
  const isLiked = btn.classList.contains('liked');
  try {
    if (isLiked) {
      await sb.from('review_comment_likes').delete().eq('comment_id', cmtId).eq('user_name', myN);
      btn.classList.remove('liked');
      btn.innerHTML = `🤍 <span>${Math.max(0, parseInt(span.textContent || '0') - 1)}</span>`;
    } else {
      await sb.from('review_comment_likes').insert({ comment_id: cmtId, user_name: myN });
      btn.classList.add('liked');
      btn.innerHTML = `❤️ <span>${parseInt(span.textContent || '0') + 1}</span>`;
    }
  } catch (e) { console.error('댓글 좋아요 실패', e); }
}

/* ── 답글 폼 토글 ── */
function toggleRvCmtReplyForm(cmtId) {
  const form = document.getElementById('rvrepform-' + cmtId);
  if (!form) return;
  const isOpen = form.classList.contains('open');
  form.classList.toggle('open', !isOpen);
  if (!isOpen) {
    const inp = document.getElementById('rvrepinp-' + cmtId);
    if (inp) inp.focus();
  }
}

/* ── 답글 등록 ── */
async function submitRvReply(parentId, reviewId) {
  const inp = document.getElementById('rvrepinp-' + parentId);
  const text = inp?.value.trim();
  if (!text) return;
  inp.value = ''; inp.style.height = '';
  try {
    const { data, error } = await sb.from('review_comments').insert({
      review_id: reviewId,
      author_name: myN,
      author_photo: myP || null,
      content: text,
      parent_id: parentId,
    }).select().single();
    if (error) throw error;
    // 기존 replies 컨테이너에 추가
    const parentEl = document.getElementById('rvcmt-' + parentId);
    if (parentEl) {
      let repliesEl = parentEl.querySelector('.rv-cmt-replies');
      if (!repliesEl) {
        const form = parentEl.querySelector('.rv-cmt-rep-form');
        repliesEl = document.createElement('div');
        repliesEl.className = 'rv-cmt-replies';
        form?.before(repliesEl);
      }
      repliesEl.insertAdjacentHTML('beforeend', `
        <div class="rv-cmt-rep" id="rvrep-${data.id}">
          <div class="rv-rep-av">${av(data.author_photo || '', data.author_name, 20)}</div>
          <div class="rv-rep-bubble">
            <div class="rv-rep-name">${esc(data.author_name)} <button style="font-size:9px;color:#E53935;border:none;background:none;cursor:pointer;font-weight:700;font-family:inherit;padding:0" onclick="deleteRvCmt('${data.id}','${reviewId}')">삭제</button></div>
            <div class="rv-rep-text">${escLines(data.content)}</div>
            <div class="rv-rep-time">${relTime(data.created_at)}</div>
          </div>
        </div>`);
    }
    // 답글 폼 닫기
    const form = document.getElementById('rvrepform-' + parentId);
    if (form) form.classList.remove('open');
    toast('답글을 남겼어요');
    // 푸시 알림 — 부모 댓글 작성자에게
    const parentCmtEl = document.getElementById('rvcmt-' + parentId);
    const parentAuthor = parentCmtEl?.dataset?.author;
    if (parentAuthor && parentAuthor !== myN) {
      const _rvIt2 = _currentReviewItemTitle ? `'${_currentReviewItemTitle}' ` : '';
      sendPushToUser(parentAuthor, `${_rvIt2}후기 답글`, `${myN}: ${text.slice(0, 60)}`, `rv:${reviewId}`);
    }
  } catch (e) {
    console.error('답글 실패', e);
    toast('답글 등록에 실패했어요');
    if (inp) inp.value = text;
  }
}

/* ── 후기 댓글 수정 ── */
function editRvCmt(cmtId) {
  const textEl = document.getElementById('rvtxt-' + cmtId);
  if (!textEl) return;
  if (textEl.querySelector('textarea')) return; // 이미 편집 중
  const original = textEl.innerText.trim();
  textEl.dataset.orig = original; // 취소 시 복원용
  textEl.innerHTML = `
    <textarea class="rv-edit-ta" id="rvEditTa-${cmtId}" maxlength="300" rows="2">${original.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</textarea>
    <div class="rv-edit-acts">
      <button class="rv-edit-cancel" onclick="cancelRvCmtEdit('${cmtId}')">취소</button>
      <button class="rv-edit-save" onclick="saveRvCmtEdit('${cmtId}',this)">저장</button>
    </div>`;
  const ta = document.getElementById('rvEditTa-' + cmtId);
  if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
}
async function saveRvCmtEdit(cmtId, btn) {
  const ta = document.getElementById('rvEditTa-' + cmtId);
  if (!ta) return;
  const newText = ta.value.trim();
  if (!newText) { toast('내용을 입력해주세요'); return; }
  if (btn) { btn.disabled = true; btn.textContent = '저장 중...'; }
  try {
    const { error } = await sb.from('review_comments').update({ content: newText }).eq('id', cmtId).eq('author_name', myN);
    if (error) throw error;
    const textEl = document.getElementById('rvtxt-' + cmtId);
    if (textEl) { textEl.innerHTML = escLines(newText); delete textEl.dataset.orig; }
    toast('댓글을 수정했어요');
  } catch (e) {
    console.error('댓글 수정 실패', e);
    toast('수정에 실패했어요');
    if (btn) { btn.disabled = false; btn.textContent = '저장'; }
  }
}
function cancelRvCmtEdit(cmtId) {
  const textEl = document.getElementById('rvtxt-' + cmtId);
  if (!textEl) return;
  const orig = textEl.dataset.orig || '';
  textEl.innerHTML = escLines(orig);
  delete textEl.dataset.orig;
}

/* ── 후기 댓글/답글 삭제 ── */
async function deleteRvCmt(cmtId, reviewId) {
  if (!confirm('댓글을 삭제할까요?')) return;
  try {
    const { error } = await sb.from('review_comments').delete().eq('id', cmtId).eq('author_name', myN);
    if (error) throw error;
    // DOM에서 제거 (루트 댓글이면 rvcmt-id, 답글이면 rvrep-id)
    const el = document.getElementById('rvcmt-' + cmtId) || document.getElementById('rvrep-' + cmtId);
    el?.remove();
    // 카드 댓글 수 업데이트
    const card = document.querySelector(`[data-rid="${reviewId}"] .rv-act-btn:last-child span`);
    if (card) card.textContent = String(Math.max(0, parseInt(card.textContent || '0') - 1));
    toast('댓글을 삭제했어요');
  } catch (e) {
    console.error('댓글 삭제 실패', e);
    toast('삭제에 실패했어요');
  }
}

/* ── 별점 피커 ── */
function rvStarHit(e) {
  e.stopPropagation();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  if (clientX === undefined) return;
  const spans = [...document.querySelectorAll('#_rvStars [data-n]')];
  if (!spans.length) return;
  let best = 0.5;
  for (const span of spans) {
    const rect = span.getBoundingClientRect();
    if (clientX >= rect.left) {
      const isLeft = (clientX - rect.left) < rect.width / 2;
      best = isLeft ? Number(span.dataset.n) - 0.5 : Number(span.dataset.n);
    }
  }
  rvRating = Math.max(0.5, Math.min(5, best));
  renderRvStarPicker();
}

function renderRvStarPicker() {
  const spans = document.querySelectorAll('#_rvStars [data-n]');
  spans.forEach(span => {
    const n = Number(span.dataset.n);
    span.className = rvRating >= n ? 'full' : rvRating >= n - 0.5 ? 'half' : '';
  });
  const hint = document.getElementById('_rvRatingHint');
  if (hint) hint.textContent = rvRating > 0 ? `${rvRating}점` : '별점을 선택해주세요';
}

/* ── 사진 처리 ── */
async function handleRvPhoto(input) {
  const files = Array.from(input.files || []);
  if (!files.length) return;
  let failed = 0;
  for (const file of files) {
    try {
      const dataUrl = await readItemImage(file, 1400, 0.85);
      if (dataUrl) rvPhotos.push(dataUrl);
    } catch (e) {
      console.error('사진 처리 실패', e);
      failed++;
    }
  }
  if (failed) toast(`사진 ${failed}장을 처리하지 못했어요`);
  renderRvPhotoPreviews();
  input.value = '';
}

function renderRvPhotoPreviews() {
  const zone = document.getElementById('_rvPhotoZone');
  if (!zone) return;
  const existing = rvExistingPhotos.map((url, i) => ({ src: url, type: 'e', idx: i }));
  const newOnes  = rvPhotos.map((d, i)          => ({ src: d,   type: 'n', idx: i }));
  const all = [...existing, ...newOnes];
  if (!all.length) {
    zone.className = 'img-zone';
    zone.onclick = () => document.getElementById('_rvFile').click();
    zone.innerHTML = `<i class="ti ti-camera" style="font-size:20px;"></i> 사진을 올려주세요`;
    return;
  }
  zone.className = 'img-zone has-img';
  zone.onclick = null;
  zone.innerHTML = all.map(p => `
    <div class="photo-preview">
      <img src="${p.src}" alt="사진">
      <button class="photo-del" onclick="removeRvPhoto('${p.type}',${p.idx})" type="button">✕</button>
    </div>`).join('') +
    `<div class="photo-add" onclick="document.getElementById('_rvFile').click()">
      <i class="ti ti-plus" style="font-size:18px;"></i><span style="font-size:11px">추가</span>
    </div>`;
}

function removeRvPhoto(type, idx) {
  if (type === 'e') rvExistingPhotos.splice(idx, 1);
  else rvPhotos.splice(idx, 1);
  renderRvPhotoPreviews();
}

/* ── 후기 등록 / 수정 ── */
async function submitReview() {
  const sel = document.getElementById('_rvItem');
  const selVal = sel?.value || '';
  const content = document.getElementById('_rvContent')?.value.trim();
  if (!selVal) { toast('상품을 선택하거나 "선택 안함"을 눌러주세요'); return; }
  if (!rvRating) { toast('별점을 선택해주세요'); return; }
  if (!content) { toast('후기 내용을 입력해주세요'); return; }
  const itemTitle = selVal === '__none__' ? '' : (rvSoldItems.find(i => i.id === selVal)?.title || '');
  const btn = document.querySelector('#_rvModal .rv-submit');
  if (btn) { btn.disabled = true; btn.textContent = rvEditId ? '수정 중...' : '등록 중...'; }
  try {
    // 새 사진 업로드
    const newUrls = await Promise.all(rvPhotos.map(d => uploadImageDataUrl(d, 'items')));
    const photo_urls = [...rvExistingPhotos, ...newUrls].filter(Boolean);

    if (rvEditId) {
      const { error } = await sb.from('reviews').update({
        item_title: itemTitle,
        content,
        rating: rvRating,
        photo_urls,
        photo_url: photo_urls[0] || '',
      }).eq('id', rvEditId);
      if (error) throw error;
      toast('후기를 수정했어요 ✅');
    } else {
      const { data: newRv, error } = await sb.from('reviews').insert({
        reviewer_name: myN,
        reviewer_photo: myP || null,
        photo_url: photo_urls[0] || '',
        photo_urls,
        item_title: itemTitle,
        content,
        rating: rvRating,
      }).select('id').single();
      if (error) throw error;
      toast('후기를 등록했어요 🎉');
      // 전체 구독자에게 새 후기 알림
      const _rvPushBody = itemTitle
        ? `'${itemTitle}' 후기가 등록됐어요 (${myN})`
        : `새 후기가 등록됐어요 (${myN})`;
      fetch(`${WORKER_URL}/push-all`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ senderName: myN, title: `구로구마켓 ⭐ 새 후기`, body: _rvPushBody, itemId: newRv?.id ? `rv:${newRv.id}` : null }),
      }).catch(() => {});
    }
    closeReviewForm();
    cachedReviews = null; _saveReviewsCache(null);
    if (statF === '후기') renderReviews();
  } catch (e) {
    console.error('후기 저장 실패', e);
    toast('저장에 실패했어요');
    if (btn) { btn.disabled = false; btn.textContent = rvEditId ? '후기 수정' : '후기 등록'; }
  }
}

async function _fetchGomindRows(id) {
  try {
    const { data, error } = await sb
      .from('item_gomindwae').select('user_key,user_name').eq('item_id', id);
    if (curId !== id) return;
    if (!error) {
      _gomindRows = data || [];
      _gomindHasNameCol = true;
    } else {
      const { data: d2 } = await sb
        .from('item_gomindwae').select('user_key').eq('item_id', id);
      if (curId !== id) return;
      _gomindRows = (d2 || []).map(r => ({ ...r, user_name: null }));
      _gomindHasNameCol = false;
    }
    _gomindLoaded = true;
  } catch (e) { console.error('gomind rows fetch 실패', e); }

async function openDet(id) {
  curId = id;
  curItem = cachedItems.find(i => i.id === id);
  if (!curItem) curItem = { id, title: '상품', price: 0, category: '기타', emoji: '📦', seller_name: '', description: '' };

  // 상품이 바뀌면 고민돼요 캐시 초기화
  _gomindRows = [];
  _gomindLoaded = false;
  _gomindHasNameCol = false;

  const own = curItem?.seller_name === myN;
  // 고민돼요 fetch를 상품 데이터 fetch와 병렬로 시작
  const gomindPromise = own ? Promise.resolve() : _fetchGomindRows(id);

  const hasFullPhotos = itemPhotoList(curItem.emoji).length && !isThumbOnlyPayload(curItem.emoji);
  const needsFullPhotos = !hasFullPhotos && !plainEmoji(curItem.emoji);
  if (needsFullPhotos) {

    try {
      loadCommentsData(id);

      if (curId !== id) return;
      curItem = { ...(curItem || {}), ...(photoItem || {}) };
      renderDet();
    } catch (e) {
      console.error(e);
      renderDet();
    }
  } else {
    renderDet();
    goTo('s-det');
  }

  try {
    // 상품 상세 + 고민돼요를 병렬로 기다림 → renderDet() 호출 시 데이터 확보
    const [{ data }] = await Promise.all([
      sb.from('items').select('*').eq('id', id).single(),
      gomindPromise,
    ]);
    if (!data || curId !== id) return;
    const dataEmoji = itemRecordPayload(data) || data.emoji;

    if (thumbs[0]) rememberItemThumbs(id, thumbs);
    curItem = {
      ...(curItem || {}),

      likeCount: curItem?.likeCount || 0,
      commentCount: curItem?.commentCount || 0,
    };
    cachedItems = cachedItems.map(i => i.id === id ? { ...i, ...curItem } : i);
    renderDet(); // 이 시점엔 _gomindRows 이미 채워져 있음 → 즉시 올바른 값 렌더
    fetchLikeCount(id).then(likeCount => {

      const heart = document.getElementById('_det-like-cnt');
      if (heart) heart.textContent = curItem.likeCount;
