async function loadComments(itemId = curId, force = false) {
  if (!itemId) return;
  const cmts = await loadCommentsData(itemId, force);
  renderComments(itemId, cmts);
}

async function loadCommentsData(itemId, force = false) {
  if (!force && commentCache.has(itemId)) {
    const cached = commentCache.get(itemId);
    renderComments(itemId, cached);
    return cached;
  }
  const localCached = !force ? getCachedComments(itemId) : null;
  if (localCached) {
    commentCache.set(itemId, localCached);
    renderComments(itemId, localCached);
  }
  if (!force && commentPromises.has(itemId)) return commentPromises.get(itemId);

  commentsLoading.add(itemId);
  const promise = fetchComments(itemId).then(cmts => {
    commentsLoading.delete(itemId);
    commentCache.set(itemId, cmts);
    rememberComments(itemId, cmts);
    renderComments(itemId, cmts);
    return cmts;
  }).catch(e => {
    commentsLoading.delete(itemId);
    console.error(e);
    return [];
  }).finally(() => {
    commentPromises.delete(itemId);
  });
  commentPromises.set(itemId, promise);
  return localCached || promise;
}

let _gomindHasNameCol = false; // user_name 컬럼 존재 여부
// ─── 고민돼요 DB 마이그레이션 (Supabase SQL 에디터에서 실행 필요) ───

// 로컬 캐시(_gomindRows)를 그대로 UI에 반영 — DB 재조회 없음 → 깜빡임 없음
function _applyGomindUI() {
  const rows = _gomindRows;
  const cnt  = rows.length;
  const isMine = (_gomindHasNameCol && myN)
    ? rows.some(r => r.user_name === myN || (!r.user_name && r.user_key === userKey))
    : rows.some(r => r.user_key === userKey);
  const btn     = document.getElementById('_gomindBtn');

  const namesEl = document.getElementById('_gomindNames');
  if (cntEl) cntEl.textContent = cnt;
  if (btn)   btn.className = 'gomind-btn' + (isMine ? ' on' : '');
  if (namesEl) {
    const names = rows.map(r => r.user_name).filter(Boolean);
    if (names.length) {
      const show = names.length > 5
        ? names.slice(0, 5).join(', ') + ` 외 ${names.length - 5}명`
        : names.join(', ');
      namesEl.textContent = `${show}님이 고민 중이에요`;

  }

// 최초 진입 or 에러 후 재동기화 — DB에서 가져와 캐시 갱신
async function loadGomind() {
  if (!curId) return;
  try {
    const { data: d1, error: e1 } = await sb
      .from('item_gomindwae').select('user_key,user_name').eq('item_id', curId);
    if (!e1) {
      _gomindRows = d1 || [];
      _gomindHasNameCol = true;
    } else {
      // user_name 컬럼 없음 → fallback
      const { data: d2 } = await sb
        .from('item_gomindwae').select('user_key').eq('item_id', curId);
      _gomindRows = (d2 || []).map(r => ({ ...r, user_name: null }));
      _gomindHasNameCol = false;
    }
    _applyGomindUI();
    _gomindLoaded = true;
  } catch (e) {
    console.error('고민돼요 로드 실패', e);
  }
}

let _gomindPending = false;
async function doToggleGomind() {
  if (_gomindPending || !curId) return;
  _gomindPending = true;
  const btn  = document.getElementById('_gomindBtn');
  const isOn = btn?.classList.contains('on');

  // ① 로컬 캐시를 먼저 수정 → UI 즉시 반영 (한 번만 업데이트, 깜빡임 없음)
  const prevRows = _gomindRows.slice(); // 에러 시 롤백용
  if (isOn) {
    // "내 항목"만 제거: user_name이 일치하면 제거, 없으면 user_key로 판별
    // && 대신 OR 기반 isMyRow로 판별해야 같은 기기 다른 닉네임 항목이 삭제되지 않음
    const isMyRow = r => (myN && r.user_name === myN) || (!r.user_name && r.user_key === userKey);
    _gomindRows = _gomindRows.filter(r => !isMyRow(r));
  } else {
    _gomindRows = [..._gomindRows, { user_key: userKey, user_name: myN || null }];
  }
  _applyGomindUI(); // 딱 한 번만 호출

  try {
    // ② DB 작업 (백그라운드)
    if (isOn) {
      if (myN) {
        const { error: de } = await sb.from('item_gomindwae').delete().eq('item_id', curId).eq('user_name', myN);
        if (de) await sb.from('item_gomindwae').delete().eq('item_id', curId).eq('user_key', userKey);
      } else {
        await sb.from('item_gomindwae').delete().eq('item_id', curId).eq('user_key', userKey);
      }
    } else {
      const { error: ie } = await sb.from('item_gomindwae').insert({
        item_id: curId, user_key: userKey, user_name: myN || null,
      });
      if (ie) {
        if (ie.code === '23505') {
          // 이미 존재 — 캐시 재동기화
          await loadGomind(); return;
        }
        // user_name 컬럼 없음 등 → user_key만으로 재시도
        const { error: ie2 } = await sb.from('item_gomindwae').insert({ item_id: curId, user_key: userKey });
        if (ie2 && ie2.code !== '23505') throw new Error(ie2.message);
      }
    }
    // DB 성공 → 이미 캐시가 반영된 상태, 추가 업데이트 불필요
  } catch (e) {
    // ③ 에러 시 캐시 롤백 후 UI 복원
    _gomindRows = prevRows;
    _applyGomindUI();
    console.error('고민돼요 실패', e);
    toast('잠시 후 다시 시도해 주세요');
  } finally {
    _gomindPending = false;
  }
}

════════════════════════════════ */
let _swReg = null;
let _currentReviewAuthor = null;    // 열려있는 후기 작성자
let _currentReviewItemTitle = null; // 열려있는 후기 상품명

async function initWebPush() {
  if (location.protocol === 'file:') return;
  if (!('Notification' in window) || !navigator.serviceWorker || !('PushManager' in window)) return;
  try {
    _swReg = await navigator.serviceWorker.register('/sw.js');
    await navigator.serviceWorker.ready;

    // 새 SW가 활성화되면 앱 자동 새로고침 (배포 후 수동 새로고침 불필요)
    // localStorage 플래그로 리로드가 한 번만 발생하도록 보장 (무한 루프 방지)
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      const flag = 'gurogu_sw_reloaded';
      if (sessionStorage.getItem(flag)) return;
      sessionStorage.setItem(flag, '1');
      toast('앱이 업데이트됐어요 🔄 새로고침합니다...');
      setTimeout(() => location.reload(), 1200);
    });

    if (Notification.permission === 'granted') {
      await _saveSubscription();
    } else if (Notification.permission === 'default') {
      setTimeout(_showNotiBanner, 2000);
    }

    // 앱이 열려있는 상태에서 알림 탭 → SW가 postMessage로 itemId 전달
    navigator.serviceWorker.addEventListener('message', (event) => {
      if (event.data?.type === 'NOTI_NAV' && event.data.itemId) {
        _navigateToPushItem(event.data.itemId);
      }
    });
  } catch (e) {
    console.warn('Web Push 초기화 실패', e.message, e);
  }
}

// 푸시 알림 탭 → 앱 내 이동 (앱이 닫혀있다가 열릴 때 OR 이미 열려있을 때 모두 사용)
async function _navigateToPushItem(itemId) {
  if (!itemId || !myN) return;
  // 현재 어느 화면이든 s-main으로 리셋 후 이동
  allScreens.forEach(s => {
    document.getElementById(s).className = s === 's-main' ? 'screen active' : 'screen right';
  });
  screenHistory = ['s-main'];

  if (String(itemId).startsWith('rv:')) {
    const reviewId = itemId.slice(3);
    if (statF !== '후기') {
      statF = '후기';
      document.querySelectorAll('#s-main .stab').forEach(t => t.classList.toggle('on', t.dataset.stat === '후기'));
      await renderReviews();
    }
    await new Promise(r => setTimeout(r, 80));
    openReviewDetail(reviewId);
    return;
  }
  await openDet(itemId);
}

async function requestPushPermission() {
  if (!_swReg) return;
  if (Notification.permission === 'denied') { toast('설정에서 알림을 허용해주세요'); return; }
  if (Notification.permission === 'granted') { await _saveSubscription(); return; }
  const perm = await Notification.requestPermission();
  if (perm === 'granted') { await _saveSubscription(); toast('알림이 설정됐어요 🔔'); }
}

async function _saveSubscription() {
  if (!_swReg || !myN) return;
  try {
    const cachedEp = localStorage.getItem('_push_ep');
    // 처음이거나 캐시 없으면 → 기존 구독 해제 후 새로 구독 (VAPID 키 불일치 방지)
    if (!cachedEp) {
      const old = await _swReg.pushManager.getSubscription();
      if (old) await old.unsubscribe();
    }
    let sub = await _swReg.pushManager.getSubscription();
    if (!sub) {
      sub = await _swReg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: VAPID_PUBLIC_KEY,
      });
    }
    const subJson = sub.toJSON();
    // 이미 저장된 구독과 같으면 Supabase 저장 스킵
    if (cachedEp === subJson.endpoint) {
      console.log('✅ Web Push 구독 유지 중');
      return;
    }
    const { error } = await sb.from('user_push_tokens').upsert({
      user_name: myN,
      endpoint: subJson.endpoint,
      subscription: subJson,
      updated_at: new Date().toISOString(),
    }, { onConflict: 'user_name,endpoint' });
    if (error) console.warn('구독 저장 실패', error);
    else {
      localStorage.setItem('_push_ep', subJson.endpoint);
      console.log('✅ Web Push 구독 저장 완료');
    }
  } catch (e) {
    console.warn('Web Push 구독 실패', e.message, e);
  }
}

async function sendPushToUser(recipientName, title, body, itemId = null) {
  if (!recipientName || recipientName === myN) return; // 자기 자신에게는 안 보냄
  try {
    fetch(`${WORKER_URL}/push`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ recipientName, title, body, ...(itemId ? { itemId } : {}) }),
    });
  } catch (e) { /* 푸시 실패해도 앱 동작에 영향 없음 */ }
}

function startNotificationPolling() {
  clearInterval(notificationTimer);
  if (!myN) return;
  pollNotifications();
  notificationTimer = setInterval(() => pollNotifications(), 30000);
}

/* ── … → ... 자동교정 방지 ── */
document.addEventListener('input', e => {
  const el = e.target;
  if (el.tagName !== 'TEXTAREA' && el.tagName !== 'INPUT') return;
  if (el.value.includes('…')) {
    const pos = el.selectionStart;
    el.value = el.value.replaceAll('…', '...');
    try { el.setSelectionRange(pos + 2, pos + 2); } catch (_) {}
  }
}, true);

/* ── 아이폰 헤더 탭 → 맨 위로 스크롤 ── */

});
